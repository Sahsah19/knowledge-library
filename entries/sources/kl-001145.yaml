  grade_reasoning: Preregistered field RCT with a designated primary analysis, nearly 1,000 students across about fifty classes, independent graders, peer-reviewed in PNAS. The design fits the paper's causal claim about tool arms.
  design_caveat: One high school in Turkey, mathematics only, in-class review sessions rather than homework, and a research-built tool rather than a product. The arms compare whole tools, so the effect of any single response type is not isolated. The GPT Tutor prompt carried teacher-written solutions and common mistakes. The paper reports 'nearly 1,000' students; n_reported rounds that. A published correction exists (PNAS 2025;122(34):e2518204122) and was not read for this entry. Conflicts were not assessed.
