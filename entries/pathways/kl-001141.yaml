    basis_kind: SOURCED_QUOTE
sources: []
standing:
  value: theorized
  basis: Bastani et al. 2025 found that students with a hint-only GPT-4 tutor attempted answers themselves and did not suffer the learning loss seen with an unguarded one; they also found no gain over students without AI. The comparison is between tools, not single responses, and the tutor had teacher-written solutions to work from, which a general-purpose assistant does not.
  floored_by: c2
  as_of: '2026-11-10'
lifecycle:
  status: draft
  since: '2026-11-10'
distinguish_from:
- neighbor: kl-001140
  boundary: Same request and gate; the response gives a hint here and the full solution there.
claims:
- id: c1
  kind: existence
  text: A practised student asks an AI for the answer without an attempt, and the AI gives a hint and leaves the rest.
- id: c2
  kind: pathway_link
  text: Given a hint rather than the solution, the student does the reasoning themselves (impact kl-001139).
claim_evidence:
- claim_id: c2
  source: kl-001145
  quote: Furthermore, an analysis of student interactions shows that students often use GPT Base as a “crutch” by asking for and copying solutions, but they use GPT Tutor in more substantive ways like asking for help or independently attempting answers.
  locator: Introduction, summary of findings
  licenses: Students with the hint-only tutor independently attempted answers, which is the outcome c2 names.
  fit: adjacent
  bridge: Bastani et al. compare arms of a field experiment (an unguarded GPT-4 chat versus a hint-only tutor prompt with teacher-written solutions), on in-class practice in a Turkish high school. The claim here is about a single AI response to a homework request. The inference from arm-level averages to the effect of one response type is the catalog's, not the paper's.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-001145
  quote: First, the prompt instructs GPT-4 to provide hints to the student without directly giving them the answer, to encourage learning
  locator: Experimental Design
  licenses: The tutor that produced that outcome was instructed to give hints without the answer, which is the response in this pathway.
  fit: adjacent
  bridge: Bastani et al. compare arms of a field experiment (an unguarded GPT-4 chat versus a hint-only tutor prompt with teacher-written solutions), on in-class practice in a Turkish high school. The claim here is about a single AI response to a homework request. The inference from arm-level averages to the effect of one response type is the catalog's, not the paper's.
  contributes: definition
  contradicts: false
