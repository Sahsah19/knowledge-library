id: kl-001141
display_id: Pathway-119
label: The AI gives a hint on set work the person could have done, and the thinking stays with them
type: pathway
layer: judgment
definition: A person under 18 who could have attempted a set problem asks for the answer without trying, and the AI gives a hint or the next step and leaves the rest to them. The reasoning the task was set to practise stays with the person; this is the productive struggle the full-solution pathway forecloses.
