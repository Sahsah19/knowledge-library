sources: []
standing:
  value: theorized
  basis: Bastani et al. 2025 set the two kinds of tool side by side in one experiment and find the loss with the answer-giving one largely absent with the hint-only one. That is the contrast at the level of tool design, not of single responses, and the hint-only tool had teacher-written solutions behind it.
  floored_by: c1
  as_of: '2026-11-10'
claim_evidence:
- claim_id: c1
  source: kl-001145
  quote: These negative learning effects are largely mitigated by the safeguards in GPT Tutor.
  locator: Abstract
  licenses: 'The same students, the same problems: the learning loss under unguarded access was largely absent under the hint-only tutor, which is the contrast c1 states.'
  fit: adjacent
  contributes: harm_evidence
  contradicts: false
  bridge: Bastani et al. compare arms of a field experiment (an unguarded GPT-4 chat versus a hint-only tutor prompt with teacher-written solutions), on in-class practice in a Turkish high school. The claim here is about a single AI response to a homework request. The inference from arm-level averages to the effect of one response type is the catalog's, not the paper's.
claims:
- id: c1
  kind: context_dependence
  text: Holding a practised student's request for the answer fixed, giving the full solution costs them the practice and giving a hint keeps it with them.
