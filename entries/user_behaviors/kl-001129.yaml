# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-001129
display_id: UserBehavior-99
label: The person asks the AI for the full answer to set work without showing an attempt
type: user_behavior
layer: observation
definition: 'The person puts a problem from work they have been set (homework, a worksheet, an assignment) to the AI and asks for the answer or the complete solution, and their turn contains no attempt of their own: no working, no candidate answer, no statement of where they got stuck.'
distinguish_from:
- neighbor: kl-000424
  boundary: That entry is a repeated pattern across turns or sessions. This entry is one request, readable from a single turn, and is the unit a single-session test case can score.
- neighbor: kl-001131
  boundary: There the person brings their own working. Here the turn contains none.
body:
  detectable_from: person_turns
  observable_criteria: 'Both of: (a) the turn presents a problem the person says or plainly implies was set for them (pasted question text, ''question 4 on my worksheet'', ''my homework is'') and asks for the answer, the solution, or for the AI to do it (''what''s the answer'', ''solve this'', ''just do it for me''); and (b) the turn contains no working, no candidate answer and no account of where they are stuck.'
  exclusions: 'Not counted: a request that includes the person''s own attempt or candidate answer (that is kl-001131). Not counted: a request to check an answer the person gives. Not counted: a request to explain a concept with no set problem attached. Not counted: pasted question text with a request for a hint or an explanation of the method rather than the answer.'
  detection_window: single_turn
  person_state_kind: process
  condition_tags:
  - kl-000630
  - kl-001124
sources: []
standing:
  value: observed_in_transcripts
  basis: Bastani et al. 2025 clustered the messages nearly 1,000 high school students sent to a GPT-4 tutor and treat 'Repeat Question Text' and 'Ask for Answers' as a category of message; in the unguarded arm students most often simply asked for the answer. That is direct, transcript-based evidence of the request. The clusters were built by NLP and labelled by hand, in class rather than at home, so the setting is narrower than this entry.
  floored_by: c1
  as_of: '2026-11-10'
lifecycle:
  status: draft
  since: '2026-11-10'
claims:
- id: c1
  kind: existence
  text: Secondary school students ask an AI system for the answer to a set problem without offering any attempt of their own.
- id: c2
  kind: detectability
  text: The request and the absence of an attempt are readable from the person's turn alone.
- id: c3
  kind: definition_boundary
  text: This entry is a single request and kl-000424 is a repeated pattern across turns or sessions.
  grounding_eligible: false
claim_evidence:
- claim_id: c1
  source: kl-001145
  quote: Furthermore, an analysis of student interactions shows that students often use GPT Base as a “crutch” by asking for and copying solutions, but they use GPT Tutor in more substantive ways like asking for help or independently attempting answers.
  locator: Introduction, summary of findings
  licenses: High school students using an unguarded GPT-4 tutor often asked for and copied solutions, which is c1.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001145
  quote: We consider clusters where the student simply asks for the answer (specifically, “Repeat Question Text” and “Ask for Answers”) to be superficial
  locator: Results, student engagement (Fig. 3 and SI Appendix C.2)
  licenses: The authors treat a student message that repeats the question or asks for the answer as an identifiable category in the logged messages, which is c2.
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
