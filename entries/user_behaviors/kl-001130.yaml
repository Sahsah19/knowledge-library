# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-001130
display_id: UserBehavior-100
label: The person says they are bad at the subject or cannot do it
type: user_behavior
layer: observation
definition: The person states a fixed negative judgment of their own ability in the subject or kind of problem ('I'm just bad at maths', 'I can't do these', 'I'm too dumb for this'). What is pointable is the statement; it says nothing observed about their actual ability.
distinguish_from:
- neighbor: kl-001129
  boundary: That entry is a request for the answer. This entry is a statement about the self, and can occur with or without such a request.
body:
  detectable_from: person_report
  observable_criteria: A person turn contains a first-person statement that they lack ability in the subject or kind of problem, phrased as a general fact about themselves rather than about this one problem ('I'm bad at', 'I'll never get', 'I'm not a maths person', 'I can't do these').
  exclusions: 'Not counted: a statement about this problem only (''I''m stuck on part b''). Not counted: a statement of missing knowledge with no judgment of ability (''we haven''t done this yet''). Not counted: joking that the turn itself marks as joking.'
  detection_window: single_turn
  person_state_kind: state
  condition_tags:
  - kl-000630
sources: []
standing:
  value: plausible_unobserved
  basis: No source opened for this prototype documents students making such statements to an AI system. Self-efficacy research (Bandura) is the natural frame but was not opened and is not cited.
  floored_by: c1
  as_of: '2026-11-10'
lifecycle:
  status: draft
  since: '2026-11-10'
claims:
- id: c1
  kind: existence
  text: Secondary school students tell an AI system they are bad at the subject while asking for help with set work.
- id: c2
  kind: detectability
  text: The statement is readable from the person's turn alone.
claim_evidence: []
