# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-001127
display_id: Value-34
label: New to this kind of problem
type: context_value
layer: context
definition: The person has not yet been taught, or has not yet practised, the method the problem needs, and could not make a start on it from what they already know.
distinguish_from:
- neighbor: kl-001128
  boundary: The test is whether the person could make a start from what they already know, not how well they would finish.
body:
  dimension: kl-001126
  detection_note: Established when the person says they were absent for the lesson, have not covered the topic, or do not know where to begin, and their turns show no part of the method.
sources: []
standing:
  value: theorized
  basis: Bjork and Bjork 2011 describe this learner as a position in a review of human learning research; nothing measures it in student-AI conversations.
  floored_by: c1
  as_of: '2026-11-10'
lifecycle:
  status: draft
  since: '2026-11-10'
claims:
- id: c1
  kind: definition
  text: New to this kind of problem is a recognisable state of a learner with respect to a kind of problem.
claim_evidence:
- claim_id: c1
  source: kl-001146
  quote: If, however, the learner does not have the background knowledge or skills to respond to them successfully, they become undesirable difficulties.
  locator: p. 58
  licenses: Names the learner without the background knowledge or skills to respond to a difficulty, which is the person this value records.
  fit: analogical
  bridge: Bjork and Bjork summarise laboratory and classroom learning research with human instructors and materials; nothing in the chapter concerns an AI system. The transfer to an AI response is asserted here.
  contributes: definition
  contradicts: false
